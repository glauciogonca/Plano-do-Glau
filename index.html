<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Plano do Glau</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Plano alimentar pessoal.">
<meta name="theme-color" content="#16211D">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plano do Glau">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#16211D; --ink-2:#31423B; --paper:#ECEFE6; --card:#FFFFFF; --line:#D3DACC;
  --turmeric:#C07C14; --amber:#9A6210; --amber-soft:#FBF2E3; --teal:#1F5E5B; --clay:#8A3A2E; --muted:#6C7A6F; --shade:#E1E6D9;
  --tab-h:58px; --head-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--ink);}
html,body{margin:0;padding:0;height:100%;background:var(--ink);
  overflow:hidden;overscroll-behavior:none;}
body{
  color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;padding:0;}
:focus-visible{outline:2px solid var(--turmeric);outline-offset:2px;border-radius:4px;}

/* ---------- SHELL ---------- */
/* Coluna simples: html e body tem height 100% e overflow hidden, entao a casca
   herda exatamente a altura da tela. Sem 100dvh (que variava com a barra do Safari)
   e sem position:fixed (que descolava a area de toque da posicao desenhada). */
.app{height:100%;display:flex;flex-direction:column;background:var(--paper);}

.topbar{
  flex:0 0 auto; background:var(--ink); color:var(--paper);
  padding:calc(min(env(safe-area-inset-top,12px),60px) + 12px) 18px 12px;
}
.topbar-row{display:flex;align-items:center;gap:12px;}
.today{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#9CB0A4;}
.viewtitle{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:21px;
  letter-spacing:-.015em;margin:2px 0 0;}
.daywrap{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.daywrap[hidden]{display:none;}
.daylbl{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:#7E9186;padding-right:4px;}
.daytoggle{display:flex;background:rgba(255,255,255,.10);border-radius:100px;padding:3px;}
.daytoggle button{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.04em;
  text-transform:uppercase;padding:7px 9px;border-radius:100px;color:#9CB0A4;
  transition:background .16s,color .16s;white-space:nowrap;
}
@media (max-width:370px){ .daytoggle button{font-size:8.5px;padding:7px 7px;} }
.daytoggle button[aria-pressed="true"]{background:var(--turmeric);color:#fff;font-weight:600;}



/* ---------- medidas ---------- */
.card.prompt{background:var(--teal);color:#fff;border-color:var(--teal);padding:15px 16px;
  display:flex;align-items:center;gap:13px;}
.prompt .ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;
  background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;}
.prompt .ic svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
.prompt .txt{flex:1;min-width:0;}
.prompt .txt b{display:block;font-size:15.5px;font-weight:700;line-height:1.25;}
.prompt .txt span{display:block;font-size:12.5px;color:rgba(255,255,255,.82);margin-top:2px;}
.prompt .go{flex:0 0 auto;background:#fff;color:var(--teal);font-weight:700;font-size:13.5px;
  padding:10px 14px;border-radius:9px;white-space:nowrap;}
.prompt .go:active{background:#DEEAE4;}
@media (max-width:360px){
  .card.prompt{flex-wrap:wrap;gap:10px;}
  .card.prompt .txt{flex:1 1 60%;}
  .card.prompt .go{flex:1 1 100%;text-align:center;padding:12px;}
}

.entry{display:flex;gap:10px;align-items:stretch;margin-top:12px;}
.entry input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:10px;
  font-family:"IBM Plex Mono",monospace;font-size:17px;background:#fff;color:var(--ink);
  text-align:center;}
.entry input:focus{outline:none;border-color:var(--turmeric);}
.entry button{flex:0 0 auto;padding:0 20px;background:var(--ink);color:#fff;border-radius:10px;
  font-weight:700;font-size:15px;}
.entry button:active{background:var(--ink-2);}
.entry button[disabled]{background:var(--line);color:var(--muted);}
.unit{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);}

.stat{display:flex;gap:12px;margin:14px 0 0;}
.stat > div{flex:1;background:var(--shade);border-radius:10px;padding:13px 14px;}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:23px;font-weight:800;
  letter-spacing:-.02em;line-height:1.1;}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-top:5px;}
.stat .up{color:var(--teal);} .stat .down{color:var(--clay);} .stat .flat{color:var(--ink-2);}

.card.verdict{border-left:5px solid var(--muted);border-radius:0 14px 14px 0;}
.card.verdict.good{border-left-color:var(--teal);}
.card.verdict.act{border-left-color:var(--turmeric);}
.card.verdict.warn{border-left-color:var(--clay);}
.verdict h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;
  margin:6px 0 6px;letter-spacing:-.01em;}
.verdict p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6;}

.chart{width:100%;height:auto;display:block;margin-top:6px;overflow:visible;}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;}
.chart .ma{fill:none;stroke:var(--turmeric);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.chart .pt{fill:var(--muted);}
.chart .lbl{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--muted);}

.hist{list-style:none;margin:10px 0 0;padding:0;}
.hist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EDF0E8;
  font-size:15px;}
.hist li:last-child{border-bottom:none;}
.hist .d{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);flex:0 0 auto;}
.hist .v{font-family:"IBM Plex Mono",monospace;font-weight:600;}
.hist .del{margin-left:auto;color:var(--muted);font-size:19px;line-height:1;padding:4px 8px;}
.hist .del:active{color:var(--clay);}

.seg{display:flex;background:var(--shade);border-radius:10px;padding:3px;margin-bottom:14px;}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;}
.prow:active{transform:scale(.99);}
.prow .body{flex:1;min-width:0;}
.prow .body b{display:block;font-size:15.5px;font-weight:700;}
.prow .body span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);}
.prow .pr{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;text-align:right;flex:0 0 auto;}
.tag{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;margin-top:4px;padding:2px 6px;border-radius:4px;}
.tag.barato{background:#DCE8DA;color:#28513F;}
.tag.justo{background:var(--shade);color:var(--muted);}
.tag.caro{background:#F3DAD5;color:#7C3225;}
.tag.novo{background:#F5E3C4;color:#7A5410;}
.fl{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 6px;}
.fi{width:100%;min-width:0;max-width:100%;padding:13px;border:1px solid var(--line);
  border-radius:10px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit;display:block;}
/* o iOS dá largura intrínseca ao input de data e ele estoura o card */
input[type="date"].fi{-webkit-appearance:none;appearance:none;text-align:left;min-height:48px;}
.fi:focus{outline:none;border-color:var(--turmeric);}
textarea.fi{min-height:150px;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.55;}
.msg{margin:12px 0 0;font-size:14px;}
.msg.ok{color:var(--teal);} .msg.err{color:var(--clay);}
.card.hero{background:var(--amber);color:#fff;border-color:var(--amber);padding:22px;
  box-shadow:0 6px 20px -8px rgba(154,98,16,.55);}
.card.hero .eyebrow{color:rgba(255,255,255,.82);}
.card.hero .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:38px;
  line-height:1;letter-spacing:-.03em;margin:10px 0 4px;}
.card.hero .s{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:rgba(255,255,255,.86);}
.card.hero .st{display:flex;gap:10px;margin-top:16px;}
.card.hero .st>div{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:11px 12px;}
.card.hero .st b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:800;}
.card.hero .st span{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.75);display:block;margin-top:4px;}
.seg button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);
  box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ---------- linha do dia (dentro de Agora, com rótulos) ---------- */
.card.timeline{padding:18px 16px 16px;}
.tl-head{display:flex;align-items:baseline;gap:8px;margin-bottom:18px;}
.tl-head .eyebrow{flex:1;}
.tl-head .legend{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:5px;}
.tl-head .legend i{width:8px;height:8px;border-radius:50%;background:var(--turmeric);display:block;}
.tl{position:relative;display:flex;justify-content:space-between;}
.tl-line{position:absolute;top:6px;height:2px;background:var(--shade);border-radius:2px;}
.tl-line i{display:block;height:100%;background:var(--turmeric);border-radius:2px;transition:width .5s ease;}
.tl-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
  min-width:0;text-align:center;}
.tl-dot{width:13px;height:13px;border-radius:50%;background:var(--card);
  border:2px solid var(--line);box-sizing:border-box;z-index:1;}
.tl-item.past .tl-dot{background:var(--turmeric);border-color:var(--turmeric);}
.tl-item.cur .tl-dot{width:13px;height:13px;background:var(--turmeric);border-color:var(--turmeric);}
.tl-tick{width:3px;height:15px;border-radius:2px;background:var(--line);margin:-1px 0;z-index:1;}
.tl-item.past .tl-tick{background:var(--teal);}
.tl-item.cur .tl-tick{background:var(--teal);width:4px;height:17px;margin:-2px 0;}
.tl-item.train .tl-t{color:var(--muted);}
.tl-item.train .tl-n{font-style:italic;letter-spacing:.02em;}
.tl-item.train.cur .tl-t,.tl-item.train.cur .tl-n{color:var(--teal);font-weight:600;}

.trainrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:12px 6px 14px;border-bottom:1px solid var(--line);margin:2px 0 12px;background:none;}
.trainrow .t{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);flex:0 0 auto;}
.trainrow .n{font-weight:600;font-size:15px;color:var(--ink-2);}
.trainrow .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-left:auto;}
.trainrow.cur .t,.trainrow.cur .n{color:var(--teal);}
.tl-t{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);line-height:1;}
.tl-n{font-size:10px;color:var(--muted);line-height:1.15;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-item.past .tl-t{color:var(--ink-2);}
.tl-item.cur .tl-t{color:var(--turmeric);font-weight:600;}
.tl-item.cur .tl-n{color:var(--ink);font-weight:700;}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);
  overscroll-behavior:contain;
  padding:18px 18px 28px;}
.view{display:none;}
.view.active{display:block;animation:fade .22s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- TAB BAR ---------- */
/* A barra volta a ser filha normal do flex.
   Ela NAO pode ser position:fixed: no iOS standalone isso desenhava a barra
   num lugar e registrava o toque em outro — era o que a quebrava apos alguns toques.
   A altura excessiva nunca foi um vao: era esta propria padding-bottom
   usando env(safe-area-inset-bottom) sem limite. Agora tem teto. */
.tabbar{
  /* O iOS entrega um viewport de 797pt numa tela de 844 e pinta os 47pt do
     indicador de home com o fundo do html (escuro). Essa faixa cola na barra.
     Por isso o conteudo desce: ~30pt de folga aqui em cima equilibram os
     47pt de chao invisivel la embaixo. */
  flex:0 0 66px; height:66px; box-sizing:border-box; overflow:hidden;
  display:grid; grid-template-columns:repeat(4,1fr); align-content:start;
  background:var(--ink);
  padding:30px 0 0;
  box-shadow:0 -1px 0 rgba(255,255,255,.08);
}
.tabbar button{
  position:relative; min-width:0; padding:0 1px;
  height:36px; display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:2px; color:#7E9186; transition:color .16s;
}
.tabbar button[aria-current="page"]{color:var(--turmeric);}
.tabbar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
.tabbar span{font-size:9.5px;letter-spacing:-.01em;font-weight:600;white-space:nowrap;
  line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.tabbar .badge[hidden]{display:none;}
.tabbar .badge{position:absolute;top:-2px;left:50%;margin-left:4px;background:var(--turmeric);
  color:#fff;font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
  min-width:14px;height:14px;border-radius:100px;display:flex;align-items:center;
  justify-content:center;padding:0 3px;line-height:1;}
@media (max-width:340px){ .tabbar span{font-size:8.5px;} .tabbar svg{width:18px;height:18px;} }

/* ---------- CARDS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--turmeric);font-weight:600;}
.eyebrow.q{color:var(--muted);}

/* NOW card */
.card.now{background:var(--amber);color:#fff;border-color:var(--amber);padding:24px 22px;
  box-shadow:0 6px 20px -8px rgba(154,98,16,.55);}
.card.now .eyebrow{color:rgba(255,255,255,.82);}
.card.now h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:32px;
  line-height:1.05;letter-spacing:-.025em;margin:8px 0 4px;}
.card.now .when{font-family:"IBM Plex Mono",monospace;font-size:13px;color:rgba(255,255,255,.86);}
.card.now .macroline{display:flex;gap:16px;margin:16px 0 18px;}
.card.now .macroline div{flex:1;}
.card.now .macroline b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px;
  font-weight:700;letter-spacing:-.02em;}
.card.now .macroline span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.78);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--turmeric);color:#fff;font-weight:700;font-size:15px;
  padding:14px;border-radius:10px;transition:filter .16s;}
.btn:active{filter:brightness(.9);}
.card.now .btn{background:#fff;color:var(--amber);font-weight:800;}
.card.now .btn:active{background:#F2E7D2;}
.btn.quiet{background:var(--card);border:1px solid var(--line);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:600;padding:14px;}
.btn.quiet:active{background:var(--shade);}

/* next-up strip */
.next{display:flex;align-items:center;gap:11px;padding:13px 6px 15px;background:none;
  border:none;border-bottom:1px solid var(--line);border-radius:0;margin:2px 0 14px;width:100%;text-align:left;}
.next .t{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);flex:0 0 auto;}
.next .n{font-weight:600;font-size:15px;color:var(--ink-2);}
.next .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-left:auto;}

/* progress bars */
.bars{display:grid;gap:14px;}
.bar-row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.bar-row .lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);}
.bar-row .val{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink);}
.bar-row .val em{font-style:normal;color:var(--muted);}
.track{height:7px;background:var(--shade);border-radius:100px;overflow:hidden;}
.track i{display:block;height:100%;border-radius:100px;transition:width .5s ease;}

/* meal list */
.mealrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:10px;transition:border-color .16s,transform .1s;}
.mealrow:active{transform:scale(.985);border-color:var(--turmeric);}
.mealrow .time{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  color:var(--ink);background:var(--shade);padding:6px 8px;border-radius:6px;flex:0 0 auto;}
.mealrow .body{flex:1;min-width:0;}
.mealrow .body b{display:block;font-size:16.5px;font-weight:700;}
.mealrow .body span{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);}
.mealrow .chev{color:var(--muted);flex:0 0 auto;}
.mealrow.now-row{background:var(--amber-soft);border-color:var(--turmeric);
  border-left:5px solid var(--turmeric);padding-left:14px;}
.mealrow.now-row .time{background:var(--turmeric);color:#fff;}
.mealrow .tagnow{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;background:var(--turmeric);color:#fff;
  padding:2px 6px;border-radius:4px;margin-left:7px;vertical-align:1px;}

/* ---------- DETAIL SHEET ---------- */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--paper);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);}
.sheet.open{transform:none;}
.sheet-head{flex:0 0 auto;background:var(--ink);color:var(--paper);
  padding:calc(min(env(safe-area-inset-top,10px),60px) + 10px) 16px 14px;display:flex;align-items:center;gap:12px;}
.sheet-head .back{display:flex;align-items:center;gap:6px;font-size:15px;color:#9CB0A4;padding:6px 4px;}
.sheet-head .back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.sheet-head h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;
  margin:0;letter-spacing:-.01em;}
.sheet-body{flex:1;overflow-y:auto;padding:18px 18px calc(min(env(safe-area-inset-bottom,18px),18px) + 40px);}

/* tables */
table{width:100%;border-collapse:collapse;font-size:15px;}
th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:left;padding:0 6px 8px 0;border-bottom:1px solid var(--line);}
th.n,td.n{text-align:right;padding-right:0;white-space:nowrap;
  font-variant-numeric:tabular-nums;}
td{padding:11px 6px 11px 0;border-bottom:1px solid #EDF0E8;vertical-align:top;}
td.n{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);}
/* separa as colunas numericas: o atalho `padding` de td zera o lado esquerdo */
th.n,td.n{padding-left:20px;}
td.n:last-child,th.n:last-child{min-width:44px;}
td.n:not(:last-child){color:var(--ink);}
tr.sum td{border-bottom:none;font-weight:700;padding-top:12px;}
.qty{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:2px;}

/* accordion — progressive disclosure */
.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-top:10px;overflow:hidden;}
.acc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;
  cursor:pointer;font-weight:600;font-size:14.5px;}
.acc summary::-webkit-details-marker{display:none;}
.acc summary .ico{width:22px;height:22px;border-radius:6px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:#fff;}
.acc summary .plus{margin-left:auto;color:var(--muted);font-size:19px;line-height:1;
  transition:transform .2s;font-family:"IBM Plex Mono",monospace;}
.acc[open] summary .plus{transform:rotate(45deg);}
.acc .inner{padding:0 16px 16px;font-size:14.5px;color:var(--ink-2);line-height:1.6;}
.acc .inner b{color:var(--ink);}
.acc.why .ico{background:var(--turmeric);}
.acc.prep .ico{background:var(--teal);}
.acc.warn .ico{background:var(--clay);}
.acc.warn summary{color:var(--clay);}

/* shopping */
.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:10px;}
.grp.full{border-color:var(--teal);background:#F5F8F3;}
.grp h3{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--teal);margin:0 0 12px;display:flex;align-items:center;}
.grp.full h3{color:var(--muted);}
.grp h3 .c{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.04em;}
.grp ul{list-style:none;margin:0;padding:0;}
.grp li{margin:0;}
.grp li{display:flex;align-items:flex-start;gap:8px;}
.grp label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:15.5px;flex:1;min-width:0;}
.pbtn{flex:0 0 auto;text-align:right;padding:9px 0 9px 8px;}
.pbtn .pv{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.pbtn .tag{margin-top:3px;}
.pbtn.vazio .pv{color:var(--turmeric);font-weight:600;font-size:12px;}
.qf{background:var(--card);border:1px solid var(--turmeric);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.qf .lin{display:flex;gap:10px;align-items:flex-end;}
.qf .lin>div{flex:1;min-width:0;}
.qf .lin button{flex:0 0 auto;background:var(--turmeric);color:#fff;font-weight:700;font-size:15px;
  padding:14px 18px;border-radius:10px;white-space:nowrap;}
.qf .lin button:active{filter:brightness(.92);}
.addbar{display:flex;gap:8px;margin-bottom:12px;}
.addbar button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:600;color:var(--ink);}
.addbar button:active{background:var(--shade);}
.grp input{appearance:none;width:21px;height:21px;flex:0 0 21px;margin-top:1px;
  border:1.5px solid var(--muted);border-radius:6px;background:#fff;position:relative;transition:.14s;}
.grp input:checked{background:var(--teal);border-color:var(--teal);}
.grp input:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.grp input:checked + span{text-decoration:line-through;color:var(--muted);}

/* guide menu */
.menu{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;}
.menu button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 18px;border-bottom:1px solid #EDF0E8;font-size:16px;font-weight:600;}
.menu button:last-child{border-bottom:none;}
.menu button:active{background:var(--shade);}
.menu .sub{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;}
.menu .chev{margin-left:auto;color:var(--muted);}
.menu .body{flex:1;min-width:0;}

/* misc */
.flag{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:3px 7px;border-radius:5px;
  letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
.flag.ok{background:#DCE8DA;color:#28513F;}
.flag.watch{background:#F5E3C4;color:#7A5410;}
.flag.act{background:#F3DAD5;color:#7C3225;}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 16px;}
h3.sec{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;
  margin:24px 0 10px;letter-spacing:-.01em;}
h3.sec:first-child{margin-top:0;}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0;}
ol.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:14px;font-size:15px;}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:0;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--turmeric);
  border:1px solid var(--line);border-radius:6px;width:26px;height:22px;background:#fff;
  display:flex;align-items:center;justify-content:center;}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);line-height:1.6;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}

/* ---------- v8: lista de itens da refeição ---------- */
.ilist{list-style:none;margin:14px 0 0;padding:0;}
.ilist li{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid #EDF0E8;}
.ilist li:last-child{border-bottom:none;}
.ilist .nm{flex:1;min-width:0;font-size:15.5px;}
.ilist .nt{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
.ilist .nt.w{color:var(--clay);}
.ilist .q{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;text-align:right;}
.ilist .mc{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;white-space:nowrap;}
.msum{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:12px;}
.card.now .ilist{margin-top:10px;}
.card.now .ilist li{border-bottom-color:rgba(255,255,255,.18);}
.card.now .ilist .nt:not(.w){display:none;}
.card.now .ilist .nt.w{color:#FFE7C4;font-weight:600;}
.card.now .msum{color:rgba(255,255,255,.8);}
.card.now .lk{color:#fff;}
.lk{display:inline-block;margin-top:14px;padding:4px 0;font-size:14px;font-weight:700;
  color:var(--teal);text-decoration:underline;text-underline-offset:3px;background:none;border:none;}
.srow{display:flex;gap:8px;margin-bottom:12px;}
.srow input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;}
.srow .btn{width:auto;flex:0 0 auto;padding:0 14px;}
.steps{margin:10px 0 0;padding-left:20px;}
.steps li{margin:0 0 10px;font-size:15px;line-height:1.45;}
.steps li b{font-weight:700;}
.mk{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid #EDF0E8;}
.mk:last-of-type{border-bottom:none;}
.mk .d{flex:0 0 74px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);}
.mk .t{flex:1;min-width:0;font-size:15px;font-weight:600;}
.mk .s{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);}
.mk.done .t{color:var(--muted);text-decoration:line-through;}
.mk.nx .s{color:var(--turmeric);font-weight:700;}
</style>
</head>

/* ============ helpers de render ============ */

/* ============ linha do dia (rotulada) ============ */
const SHORT = { cafe1:'café 1', cafe2:'café 2', almoco:'almoço', lanche:'lanche', pre:'pré', ceia:'ceia', jantar:'jantar' };
const DAYLBL = { manha:'treino de manhã', treino:'treino à noite', descanso:'dia sem treino' };
const TRAIN = {
  manha:    { time:'07:00', min:420,  dur:75 },
  treino:   { time:'21:00', min:1260, dur:75 },
  descanso: null
};
function timelineHTML(){
  const t = nowMin();
  const tr = TRAIN[dayType];

  // refeições + treino, em ordem cronológica
  const list = meals().map(m => ({
    min:m.min, time:m.time, kind:'meal',
    label: m.id==='ceia' ? (m.name==='Jantar'?'jantar':'ceia')
           : (m.id==='cafe1' && dayType==='manha') ? 'café'
           : (SHORT[m.id]||m.name.toLowerCase())
  }));
  if (tr) list.push({ min:tr.min, time:tr.time, kind:'train', label:'treino', dur:tr.dur });
  list.sort((a,b)=>a.min-b.min);

  const n = list.length;
  const first = list[0].min, last = list[n-1].min;

  let f = 0;
  if (t >= last) f = 1;
  else if (t > first){
    for (let i=0;i<n-1;i++){
      if (t >= list[i].min && t < list[i+1].min){
        f = (i + (t - list[i].min)/(list[i+1].min - list[i].min)) / (n-1);
        break;
      }
    }
  }

  const lineLeft = (0.5/n)*100, lineW = ((n-1)/n)*100;

  let items = '';
  list.forEach((it,i)=>{
    const end = it.kind==='train' ? it.min + it.dur : (list[i+1] ? list[i+1].min : 1440);
    const isNow = t >= it.min && t < end;
    const past = t >= it.min && !isNow;
    const mark = it.kind==='train' ? '<span class="tl-tick"></span>' : '<span class="tl-dot"></span>';
    items += `<div class="tl-item ${it.kind==='train'?'train':''} ${isNow?'cur':''} ${past?'past':''}">
      ${mark}
      <span class="tl-t">${it.time}</span>
      <span class="tl-n">${it.label}</span>
    </div>`;
  });

  return `<div class="card timeline">
    <div class="tl-head">
      <span class="eyebrow q">Sequência de hoje · ${DAYLBL[dayType]}</span>
      <span class="legend"><i></i> já passou</span>
    </div>
    <div class="tl">
      <div class="tl-line" style="left:${lineLeft}%;width:${lineW}%">
        <i style="width:${(f*100).toFixed(1)}%"></i>
      </div>
      ${items}
    </div>
  </div>`;
}

/* ============ MEDIDAS ============ */
const today = () => new Date().toISOString().slice(0,10);
const dnum  = (iso) => Math.round(new Date(iso+'T00:00:00').getTime()/86400000);
const getW  = () => DB.get('peso',[]).slice().sort((a,b)=>a.d<b.d?-1:1);
const getC  = () => DB.get('cintura',[]).slice().sort((a,b)=>a.d<b.d?-1:1);
function addM(key, val){
  const arr = DB.get(key,[]).filter(x => x.d !== today());
  arr.push({ d: today(), v: val });
  DB.set(key, arr);
}
function delM(key, d){ DB.set(key, DB.get(key,[]).filter(x => x.d !== d)); }

/* dia de pesar: seg, qua, sex. Cintura: a cada 14 dias desde o início. */
function isWeighDay(){ return [1,3,5].includes(new Date().getDay()); }
function waistDue(){
  const c = getC();
  if (!c.length) return true;
  return dnum(today()) - dnum(c[c.length-1].d) >= 14;
}
function pending(){
  const w = getW();
  const wToday = w.length && w[w.length-1].d === today();
  return { peso: isWeighDay() && !wToday, cintura: waistDue() };
}

/* média dos registros dentro de uma janela de N dias terminando em `end` */
function avgWindow(arr, endDay, days){
  const sel = arr.filter(x => { const n = dnum(x.d); return n <= endDay && n > endDay - days; });
  if (!sel.length) return null;
  return sel.reduce((s,x)=>s+x.v,0) / sel.length;
}

function trend(){
  const w = getW();
  if (w.length < 4) return { ok:false, need:'poucos registros' };
  const last = dnum(w[w.length-1].d);
  const span = last - dnum(w[0].d);
  if (span < 13) return { ok:false, need:'menos de duas semanas' };
  const a = avgWindow(w, last, 7);          // semana atual
  const b = avgWindow(w, last - 7, 7);      // semana anterior
  if (a === null || b === null) return { ok:false, need:'lacuna nos registros' };
  return { ok:true, atual:a, anterior:b, deltaG: Math.round((a-b)*1000) };
}

function verdict(){
  const t = trend();
  const c = getC();

  if (!t.ok){
    return { cls:'', h:'Ainda sem tendência',
      p:`Preciso de pelo menos duas semanas de pesagens para calcular uma média confiável (${t.need}). Peso de um dia isolado varia até 1 kg por água, sal e conteúdo intestinal. Não significa nada sozinho.` };
  }

  const g = t.deltaG;
  let dC = null;
  if (c.length >= 2) dC = +(c[c.length-1].v - c[c.length-2].v).toFixed(1);

  if (dC !== null && dC > 1.5 && g < 250){
    return { cls:'warn', h:'Cintura subindo mais que o peso',
      p:`A cintura aumentou ${dC} cm enquanto a média de peso subiu ${g} g na semana. Isso indica que o superávit está grande demais e parte do ganho é gordura. <b>Corte 150 kcal por dia</b> e reavalie em duas semanas.` };
  }
  if (g < 30){
    return { cls:'act', h:'Peso praticamente parado',
      p:`A média semanal variou ${g >= 0 ? '+' : ''}${g} g, abaixo dos 50 a 75 g esperados. Se isso se repetir por três semanas, <b>adicione 150 kcal por dia</b>. Uma semana isolada ainda pode ser ruído.` };
  }
  if (g > 150){
    return { cls:'warn', h:'Ganho rápido demais',
      p:`A média subiu ${g} g na semana, acima da faixa de 50 a 75 g. Acima disso a proporção de gordura no ganho cresce. Se a cintura acompanhar, <b>corte 150 kcal por dia</b>.` };
  }
  return { cls:'good', h:'No ritmo certo',
    p:`A média semanal subiu ${g} g${dC !== null ? `, com a cintura ${dC > 0 ? 'em +' + dC : dC < 0 ? dC + '' : 'estável'} cm` : ''}. É exatamente a faixa em que o ganho é predominantemente muscular. Não mude nada.` };
}

/* gráfico: pontos + média móvel de 7 dias */
function chartHTML(arr, unit){
  if (arr.length < 2) return '';
  const W = 320, H = 116, PL = 34, PR = 8, PT = 10, PB = 20;
  const d0 = dnum(arr[0].d), d1 = dnum(arr[arr.length-1].d);
  const span = Math.max(1, d1 - d0);
  const vs = arr.map(x=>x.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max((hi-lo)*0.25, unit === 'kg' ? 0.4 : 1);
  lo -= pad; hi += pad;
  const X = (iso)=> PL + (dnum(iso)-d0)/span * (W-PL-PR);
  const Y = (v)=> PT + (hi-v)/(hi-lo) * (H-PT-PB);

  const pts = arr.map(x=>`<circle class="pt" cx="${X(x.d).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="2.4"/>`).join('');

  const ma = arr.map(x=>{
    const n = dnum(x.d);
    const win = arr.filter(y=>{ const m = dnum(y.d); return m <= n && m > n-7; });
    return { d:x.d, v: win.reduce((s,y)=>s+y.v,0)/win.length };
  });
  const path = ma.map((p,i)=>`${i?'L':'M'}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');

  const mid = (lo+hi)/2;
  const gl = [hi-pad*0.5, mid, lo+pad*0.5].map(v=>
    `<line class="grid" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
     <text class="lbl" x="${PL-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v.toFixed(unit==='kg'?1:0)}</text>`
  ).join('');

  const fd = (iso)=>{ const p=iso.split('-'); return p[2]+'/'+p[1]; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Evolução de ${unit === 'kg' ? 'peso' : 'cintura'}: ${arr.length} registros">
    ${gl}${pts}<path class="ma" d="${path}"/>
    <text class="lbl" x="${PL}" y="${H-5}">${fd(arr[0].d)}</text>
    <text class="lbl" x="${W-PR}" y="${H-5}" text-anchor="end">${fd(arr[arr.length-1].d)}</text>
  </svg>
  <p class="lede" style="margin:6px 0 0;font-size:12px;">Pontos são as pesagens. A linha é a média móvel de 7 dias: é ela que importa.</p>`;
}

function flagInvalid(el, msg){
  el.style.borderColor = 'var(--clay)';
  el.focus();
  let note = el.parentElement.parentElement.querySelector('.invalid');
  if (!note){
    note = document.createElement('p');
    note.className = 'lede invalid';
    note.style.cssText = 'margin:10px 0 0;font-size:13px;color:var(--clay);';
    el.parentElement.after(note);
  }
  note.textContent = msg;
}

const MILESTONES = [
  { d:28, t:'Revisar as calorias',
    w:'Com 4 semanas de peso (3 vezes por semana) e duas medidas de cintura, dá para saber se as calorias atuais geram superávit de verdade. Peso parado por 3 semanas: some 150 kcal por dia. Cintura subindo mais de 1,5 cm sem ganho proporcional de peso: tire 150.' },
  { d:56, t:'Reavaliar colágeno e magnésio',
    w:'Ficaram de fora no início para manter o experimento limpo. Com dois meses de dieta estável, introduza um de cada vez e observe por duas semanas antes do próximo.' },
  { d:84, t:'Refazer os exames',
    w:'HbA1c, TGP/TGO, vitamina D, mais os que faltaram: glicemia e insulina de jejum, perfil lipídico, ferritina, GGT, ácido úrico e eletroforese de hemoglobina. Jejum de 12 h e sem treinar nas 48 h anteriores.' }
];

function startDate(){
  let s = DB.get('start', null);
  if (!s){ s = new Date().toISOString().slice(0,10); DB.set('start', s); }
  return s;
}
function daysSince(){
  const s = new Date(startDate()+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.max(0, Math.round((now - s)/86400000));
}
function fmtDate(iso){
  const mes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const d = new Date(iso+'T00:00:00');
  return `${d.getDate()} ${mes[d.getMonth()]} ${d.getFullYear()}`;
}
function marcoData(m){
  return new Date(new Date(startDate()+'T00:00:00').getTime() + m.d*86400000).toISOString().slice(0,10);
}
function marcoProx(){
  const el = daysSince();
  const m = MILESTONES.find(x => x.d >= el);
  return m ? { m, falta: m.d - el } : null;
}
const emDias = f => f===0 ? 'hoje' : f===1 ? 'amanhã' : 'em '+f+' dias';

function marcosHTML(){
  const el = daysSince(), px = marcoProx(), s = startDate();
  let h = `<div class="card">
    <div class="eyebrow q">Marcos do plano · semana ${Math.floor(el/7)+1}</div>`;
  MILESTONES.forEach(m=>{
    const done = m.d < el, nx = px && px.m === m;
    h += `<div class="mk ${done?'done':''} ${nx?'nx':''}">
      <span class="d">${fdia(marcoData(m))}</span>
      <span class="t">${m.t}</span>
      <span class="s">${done ? 'passou' : nx ? emDias(px.falta) : 'dia '+m.d}</span>
    </div>`;
  });
  if (px) h += accs([['prep','O que fazer em "'+px.m.t+'"', px.m.w]]);
  else h += `<p style="margin:10px 0 0;font-size:14px;">Os três marcos passaram. Se os exames foram refeitos, recomece a contagem com a data da coleta.</p>`;
  h += `<details class="acc" style="margin-top:10px;">
      <summary><span class="ico" style="background:var(--muted)">i</span>Início em ${fmtDate(s)}<span class="plus">+</span></summary>
      <div class="inner">
        <p style="margin:0 0 10px;">Se a contagem não bate, corrija a data em que começou o plano.</p>
        <input type="date" id="startInput" value="${s}"
          style="width:100%;min-width:0;-webkit-appearance:none;appearance:none;padding:12px;border:1px solid var(--line);border-radius:9px;
                 font-family:'IBM Plex Mono',monospace;font-size:15px;background:#fff;color:var(--ink);">
      </div>
    </details>
  </div>`;
  return h;
}

function renderAgora(){

  let current = null, next = null;

    if (t >= m.min && t < end){ current = m; next = list[i+1] || null; break; }
  }
  if (!current && t < list[0].min) next = list[0];

  const done = list.filter(m => t >= m.min);
  const eaten = done.reduce((s,m)=>s+m.kcal,0);

    </div>`;

  if (next && current){
    h += `<button class="card next" data-meal="${next.id}" style="width:100%;text-align:left;">
      <span class="k">a seguir</span>
      <span class="t">${next.time}</span>

    h += `<div class="card next"><span class="t">00:00</span><span class="n">Dormir</span>

        <div class="track"><i style="width:${pc(eatenP,tg.ptn)}%;background:var(--teal)"></i></div>
      </div>
    </div>
    <p class="lede" style="margin:14px 0 0;font-size:13px;">Conta pelas refeições cujo horário já passou. Não é registro do que você comeu.</p>
  </div>`;

  const pend = pending();
  if (pend.peso || pend.cintura){
    const ambos = pend.peso && pend.cintura;
    const titulo = ambos ? 'Hoje tem peso e cintura'
                 : pend.peso ? 'Hoje é dia de pesar'
                 : 'A cintura está vencida';

/* custo da semana a partir dos últimos preços registrados */
function custoSemana(){
  const ps = porProduto();
  const idx = {}; ps.forEach(x=>{ idx[x.p+'|'+x.u] = x; });
  const com = [], sem = [];
  CONSUMO.forEach(([p,u,q])=>{
    const x = idx[p+'|'+u];
    if (x) com.push({p,u,q,preco:x.ult.v,total:x.ult.v*q,status:x.status});
    else sem.push({p,u,q});
  });
  com.sort((a,b)=>b.total-a.total);
  return {com, sem, total: com.reduce((s,x)=>s+x.total,0)};
}

/* devolvem sempre copias: sem isso, um push em notasf() mutava NOTAS_SEED
   e o botao de restaurar passava a restaurar a base ja alterada. */
const precos = () => DB.get('precos', PRECOS_SEED.map(o=>({p:o[0],c:o[1],u:o[2],v:o[3],m:o[4],d:o[5]})))
                       .map(o=>({...o}));
const notasf = () => DB.get('notasf', NOTAS_SEED).map(n=>({...n}));
const mediana = a => { const s=[...a].sort((x,y)=>x-y), n=s.length;
  return n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2; };

function porProduto(){
  const g = {};
  precos().forEach(o=>{ const k=o.p+'|'+o.u; (g[k]=g[k]||{p:o.p,c:o.c,u:o.u,hist:[]}).hist.push(o); });
  return Object.values(g).map(x=>{
    x.hist.sort((a,b)=>a.d<b.d?-1:1);
    const vals = x.hist.map(h=>h.v);
    x.med=mediana(vals); x.min=Math.min(...vals); x.max=Math.max(...vals);
    x.ult=x.hist[x.hist.length-1];
    const b=x.hist.reduce((a,c)=>c.v<a.v?c:a); x.ondeBarato=b.m; x.precoBarato=b.v;
    x.delta = x.med ? (x.ult.v-x.med)/x.med*100 : 0;
    x.n = x.hist.length;
    x.status = x.n<2 ? 'novo' : x.delta<=-8 ? 'barato' : x.delta>=8 ? 'caro' : 'justo';
    return x;
  }).sort((a,b)=>a.p.localeCompare(b.p,'pt'));
}

/* agrupa por rodada de compra (notas a ate 3 dias), nao por semana do calendario */
function rodadas(){
  const ns = notasf().slice().sort((a,b)=>a.data<b.data?-1:1);
  const dia = iso => Math.round(new Date(iso+'T00:00:00').getTime()/86400000);
  const out = [];
  ns.forEach(n=>{
    const u = out[out.length-1];
    if (u && dia(n.data)-dia(u.fim) <= 3){
      u.valor+=n.valor; u.notas.push(n); u.fim=n.data;
    } else out.push({ini:n.data,fim:n.data,valor:n.valor,notas:[n]});
  });
  return out;
}

const numBR = s => parseFloat(String(s||'').trim().replace(/^R\$\s*/i,'').replace(/\./g,'').replace(',','.'));

/* importador do bloco de texto gerado a partir da nota */
function importarTexto(txt){
  const linhas = txt.split('\n').map(l=>l.trim()).filter(Boolean);
  let data=null, mercado=null, itens=[], dieta=null, erros=[];
  linhas.forEach((l,i)=>{
    const up = l.toUpperCase();
    if (up.startsWith('COMPRA')){
      const m = l.match(/COMPRA\s+(\d{4}-\d{2}-\d{2})\s+(.+)/i);
      if (m){ data=m[1]; mercado=m[2].trim(); } else erros.push(`linha ${i+1}: cabeçalho inválido`);
      return;
    }
    if (up.startsWith('TOTAL') || up.startsWith('DIETA')){
      const m2 = l.match(/(?:TOTAL|DIETA)\s+([\d.,]+)/i);
      if (m2) dieta = numBR(m2[1]);
      return;
    }
    const p = l.split(';').map(x=>x.trim());
    if (p.length < 3){ erros.push(`linha ${i+1}: esperado "produto; unidade; preço"`); return; }
    const v = numBR(p[2]);
    if (!isFinite(v) || v<=0){ erros.push(`linha ${i+1}: preço inválido`); return; }
    itens.push({p:p[0], c:p[3]||'Outros', u:p[1], v:+v.toFixed(2)});
  });
  if (!data || !mercado) erros.push('falta a linha COMPRA com data e mercado');
  if (erros.length) return {erro:erros};

  const base = precos();
  itens.forEach(it => base.push({p:it.p,c:it.c,u:it.u,v:it.v,m:mercado,d:data}));
  DB.set('precos', base);

  let nota = 0;
  if (dieta !== null){
    const nn = notasf();
    nn.push({data, mercado, valor:+dieta.toFixed(2)});
    DB.set('notasf', nn); nota = 1;
  }
  return {itens:itens.length, nota, mercado, data};
}

  h += `<div class="card"><div class="eyebrow q">${x.p} · por ${x.u}</div>
    <table style="margin-top:10px;">
      <tr><td>Última compra</td><td class="n"><b>${BRL(x.ult.v)}</b><span class="qty">${x.ult.m} · ${fdia(x.ult.d)}</span></td></tr>
      <tr><td>Mediana</td><td class="n">${BRL(x.med)}</td></tr>
      <tr><td>Mínimo</td><td class="n">${BRL(x.min)}</td></tr>
      <tr><td>Máximo</td><td class="n">${BRL(x.max)}</td></tr>
    </table>
    <div class="track" style="margin-top:14px;"><i style="width:${pos.toFixed(0)}%;background:${cor}"></i></div>
    <p class="lede" style="margin:8px 0 0;font-size:13px;">Onde a última compra caiu dentro da faixa já observada.</p>
  </div>
  <div class="card"><div class="eyebrow q">Histórico</div><table>
    <tr><th>Data</th><th>Mercado</th><th class="n">Preço</th></tr>`
    + x.hist.slice().reverse().map(o=>`<tr><td>${fdia(o.d)}</td><td>${o.m}</td><td class="n">${BRL(o.v)}</td></tr>`).join('')
    + `</table></div>`;
  if (x.n < 2) h += `<div class="card" style="border-color:var(--turmeric)">
    <div class="eyebrow">Sem histórico ainda</div>
    <p style="margin:8px 0 0;font-size:15px;">Com um registro só não dá para dizer se está caro. O termômetro começa a funcionar na segunda compra.</p></div>`;
  return h;
}

function blocoGastos(){
  const rs = rodadas();
  const real = rs.length ? rs.reduce((s,x)=>s+x.valor,0)/rs.length : 0;
  const cs = custoSemana();
  const ps = porProduto();
  const caros = ps.filter(x=>x.status==='caro'), baratos = ps.filter(x=>x.status==='barato');

  let h = `<div class="card hero">
    <div class="eyebrow">Custo da semana · preços atuais</div>
    <div class="v">${BRL(cs.total)}</div>
    <div class="s">${cs.com.length} itens com preço${cs.sem.length?` · ${cs.sem.length} sem preço`:''}</div>
    <div class="st">
      <div><b>${BRL(cs.total*4.33)}</b><span>por mês</span></div>
      <div><b>${BRL(cs.total/7)}</b><span>por dia</span></div>
    </div>
  </div>

  <button class="btn" id="addCompra" style="margin-bottom:14px;background:var(--ink);color:#fff;">+ Registrar compra</button>`;

  h += `<div class="card"><div class="eyebrow q">O que saiu do bolso</div>
    <table><tr><th>Quando</th><th>Onde</th><th class="n">Dieta</th></tr>`;
  rs.slice().reverse().forEach(s=>{
    const rot = s.ini===s.fim ? fdia(s.ini) : fdia(s.ini)+' a '+fdia(s.fim);
    h += `<tr><td>${rot}</td><td>${s.notas.map(n=>n.mercado).join(', ')}</td>
      <td class="n"><b>${BRL(s.valor)}</b></td></tr>`;
  });
  h += `<tr class="sum"><td><b>Média</b></td><td></td><td class="n"><b>${BRL(real)}</b></td></tr></table></div>`;

  if (caros.length || baratos.length){
    h += `<div class="card"><div class="eyebrow q">Mudou de preço na última compra</div><table>`;
    caros.forEach(x=>h+=`<tr><td>${x.p}</td><td class="n" style="color:var(--clay)">+${x.delta.toFixed(0)}%</td></tr>`);
    baratos.forEach(x=>h+=`<tr><td>${x.p}</td><td class="n" style="color:var(--teal)">${x.delta.toFixed(0)}%</td></tr>`);
    h += `</table></div>`;
  }

  h += `<details class="acc" style="margin-top:4px;">
    <summary><span class="ico" style="background:var(--muted)">i</span>De onde vem o custo da semana<span class="plus">+</span></summary>
    <div class="inner">
      <p style="margin:0 0 10px;">Consumo da semana vezes o último preço pago. O gasto real costuma ser maior porque inclui estoque que dura mais de uma semana.</p>
      <table><tr><th>Item</th><th class="n">Semana</th><th class="n">Custo</th></tr>`
      + cs.com.map(x=>`<tr><td>${x.p}<span class="qty">${BRL(x.preco)} por ${x.u}</span></td>
          <td class="n">${(+x.q.toFixed(2))} ${x.u==='kg'||x.u==='litro'?x.u:''}</td>
          <td class="n"><b>${BRL(x.total)}</b></td></tr>`).join('')
      + `</table>`
      + (cs.sem.length ? `<p style="margin:12px 0 0;font-size:13px;"><b>Sem preço ainda:</b> ${cs.sem.map(x=>x.p).join(', ')}.</p>` : '')
    + `</div>
  </details>

  <details class="acc warn" style="margin-top:10px;">
    <summary><span class="ico">!</span>Apagar tudo e recomeçar<span class="plus">+</span></summary>
    <div class="inner">
      <p style="margin:0 0 12px;">Apaga <b>todos</b> os preços e valores registrados e volta às 5 notas originais. Não dá para desfazer.</p>
      <button class="btn quiet" id="resetPrecos" style="border-color:var(--clay);color:var(--clay);">Confirmar e apagar</button>
      <div id="msgReset"></div>
    </div>
  </details>`;
  return h;
}

function formCompra(){
  const mercs = [...new Set(precos().map(o=>o.m))];
  const hoje = new Date().toISOString().slice(0,10);
  return `<div class="card">
    <div class="eyebrow q">Com a notinha</div>
    <p class="lede" style="margin:6px 0 10px;font-size:13.5px;">Mande a foto no chat, copie o bloco que voltar e cole aqui.</p>
    <textarea class="fi" id="impTxt" placeholder="COMPRA 2026-09-14 Pão de Açúcar&#10;Berinjela; kg; 12,99&#10;DIETA 151,00"></textarea>
    <button class="btn quiet" id="impBtn" style="margin-top:10px;">Importar</button>
    <div id="impMsg"></div>
  </div>
  <div class="card">
    <div class="eyebrow q">Só o valor gasto</div>
    <label class="fl" for="nData">Data</label>
    <input class="fi" id="nData" type="date" value="${hoje}">
    <label class="fl" for="nMerc">Mercado</label>
    <input class="fi" id="nMerc" list="dMerc" placeholder="Sonda" autocomplete="off">
    <datalist id="dMerc">${mercs.map(n=>`<option value="${n}">`).join('')}</datalist>
    <label class="fl" for="nTot">Quanto foi da dieta</label>
    <input class="fi" id="nTot" type="text" inputmode="decimal" placeholder="133,97">
    <button class="btn quiet" id="salvarNota" style="margin-top:14px;">Salvar</button>
    <div id="msgNota"></div>
  </div>`;
}

/* ============ sheet ============ */
const sheet = document.getElementById('sheet');
function openSheet(title, html){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('sheetBody').scrollTop = 0;
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden','false');
  history.pushState({sheet:true},'');
}
function closeSheet(){
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
}
function openMeal(id){
  const m = meals().find(x=>x.id===id);
  if (!m) return;
  const h = `<div class="card" style="margin-bottom:14px;">
    <div class="eyebrow">${m.time}${m.tag? ' · '+m.tag : ''}</div>
    ${itemsHTML(m)}
    <div class="msum">${m.kcal} kcal · ${m.ptn} g proteína</div>
  </div>${accs(m.acc)}`;
  openSheet(m.name, h);
}

/* ============ navegação ============ */
const TITLES = { agora:'Hoje', refeicoes:'Refeições', compras:'Compras', medidas:'Medidas' };
function go(v){
  view = v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>{
    if (b.dataset.go===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  document.getElementById('viewTitle').textContent = TITLES[v];
  const dt = document.getElementById('dayToggle');
  const relevant = (v === 'agora' || v === 'refeicoes');
  dt.hidden = !relevant;
  document.getElementById('main').scrollTop = 0;
  if (v==='agora') renderAgora();
  if (v==='refeicoes') renderRefeicoes();
  if (v==='medidas') renderMedidas();
}

/* ============ topo: data e hora ============ */
function renderTop(){
  const d = new Date();
  const dias = ['dom','seg','ter','qua','qui','sex','sáb'];
  const mes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('todayLabel').textContent =
    `${dias[d.getDay()]}, ${d.getDate()} ${mes[d.getMonth()]} · ${hh}:${mm}`;
}

function setDay(type){
  if (!MEALS[type]) type = 'treino';
  dayType = type; DB.set('dayType', type);
  document.querySelectorAll('#dayToggle button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.day === type)));
  renderTop(); renderAgora(); renderRefeicoes();
}

/* ============ eventos ============ */
document.addEventListener('click', (e)=>{
  const tab = e.target.closest('.tabbar button');
  if (tab){ go(tab.dataset.go); return; }

  const goBtn = e.target.closest('main [data-go], .sheet [data-go]');
  if (goBtn){ go(goBtn.dataset.go); return; }

  const seg = e.target.closest('[data-med]');
  if (seg){ medTab = seg.dataset.med; renderMedidas(); return; }

  if (e.target.closest('#savePeso')){
    const el = document.getElementById('inPeso');
    const v = parseFloat(String(el.value).replace(',','.'));
    if (isFinite(v) && v >= 30 && v <= 200){ addM('peso', +v.toFixed(2)); renderMedidas(); renderAgora(); }
    else { flagInvalid(el, 'Digite um peso entre 30 e 200 kg.'); }
    return;
  }
  if (e.target.closest('#saveCint')){
    const el = document.getElementById('inCint');
    const v = parseFloat(String(el.value).replace(',','.'));
    if (isFinite(v) && v >= 50 && v <= 150){ addM('cintura', +v.toFixed(1)); renderMedidas(); renderAgora(); }
    else { flagInvalid(el, 'Digite uma medida entre 50 e 150 cm.'); }
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del){
    const [k,d] = del.dataset.del.split('|');
    delM(k,d); renderMedidas(); renderAgora();
    return;
  }

  const caba = e.target.closest('[data-caba]');
  if (caba){ compraAba = caba.dataset.caba; renderCompras(); return; }

  const novo = e.target.closest('[data-novo]');
  if (novo){
    e.preventDefault(); e.stopPropagation();
    const [p,u] = novo.dataset.novo.split('|');
    openSheet(p, novoPreco(p, u, 'Outros'));
    return;
  }

  if (e.target.closest('#addLivre')){
    const ps = porProduto();
    const nomes = [...new Set(CONSUMO.map(c=>c[0]).concat(ps.map(x=>x.p)))].sort((a,b)=>a.localeCompare(b,'pt'));
    const mercs = [...new Set(precos().map(o=>o.m))];
    const ultimo = DB.get('ultimoMercado', mercs[0] || '');
    openSheet('Registrar preço', `<div class="qf" data-form="1" data-livre="1">
      <div class="eyebrow">Item avulso</div>
      <p class="lede" style="margin:6px 0 12px;font-size:13.5px;">Para o que você comprou fora da lista, na feira ou no mercado.</p>
      <label class="fl" for="qProd" style="margin-top:0;">Produto</label>
      <input class="fi" id="qProd" list="dProdQ" placeholder="Berinjela" autocomplete="off">
      <datalist id="dProdQ">${nomes.map(n=>`<option value="${n}">`).join('')}</datalist>
      <label class="fl" for="qUn">Unidade</label>
      <input class="fi" id="qUn" list="dUnQ" placeholder="kg" autocomplete="off">
      <datalist id="dUnQ">${['kg','litro','unidade','lata','pote','pacote','garrafa','bandeja','maço','cartela 20 un','caixa'].map(n=>`<option value="${n}">`).join('')}</datalist>
      <div class="lin" style="margin-top:14px;">
        <div><label class="fl" for="qVal" style="margin-top:0;">Preço</label>
          <input class="fi" id="qVal" type="text" inputmode="decimal" placeholder="14,99"></div>
        <button id="qSave">Salvar</button>
      </div>
      <label class="fl" for="qMerc">Mercado</label>
      <input class="fi" id="qMerc" list="dMercQ" placeholder="Feira" autocomplete="off" value="${ultimo.replace(/"/g,'&quot;')}">
      <datalist id="dMercQ">${mercs.concat(['Feira']).filter((v,i,a)=>a.indexOf(v)===i).map(n=>`<option value="${n}">`).join('')}</datalist>
      <div id="qMsg"></div>
    </div>`);
    return;
  }

  if (e.target.closest('#qSave')){
    const box = document.querySelector('[data-form="1"]');
    const msg = document.getElementById('qMsg');
    const v = numBR(document.getElementById('qVal').value);
    const m = document.getElementById('qMerc').value.trim();
    const livre = box.dataset.livre === '1';
    const p = livre ? document.getElementById('qProd').value.trim() : box.dataset.p;
    const u = livre ? document.getElementById('qUn').value.trim()   : box.dataset.u;
    const c = box.dataset.c || 'Outros';
    if (!p || !u){ msg.className='msg err'; msg.textContent='Informe produto e unidade.'; return; }
    if (!isFinite(v) || v<=0){ msg.className='msg err'; msg.textContent='Preço inválido.'; return; }
    if (!m){ msg.className='msg err'; msg.textContent='Informe o mercado.'; return; }

    const a = precos();
    a.push({p, c, u, v:+v.toFixed(2), m, d:new Date().toISOString().slice(0,10)});
    DB.set('precos', a);
    DB.set('ultimoMercado', m);
    renderCompras();

    // reabre a folha já com o novo registro dentro
    const ps = porProduto();
    const k = ps.findIndex(x=>x.p===p && x.u===u);
    window.__precos = ps;
    if (k >= 0){
      document.getElementById('sheetTitle').textContent = p;
      document.getElementById('sheetBody').innerHTML = detalhePreco(k);
      document.getElementById('sheetBody').scrollTop = 0;
      const m2 = document.getElementById('qMsg');
      if (m2){ m2.className='msg ok'; m2.textContent = `${BRL(v)} em ${m} registrado.`; }
    }
    return;
  }

  const pdet = e.target.closest('[data-preco]');
  if (pdet){
    e.preventDefault(); e.stopPropagation();
    const i=+pdet.dataset.preco; openSheet(window.__precos[i].p, detalhePreco(i)); return;
  }

  if (e.target.closest('#impBtn')){
    const el = document.getElementById('impTxt');
    const msg = document.getElementById('impMsg');
    const r = importarTexto(el.value);
    if (r.erro){
      msg.className='msg err';
      msg.innerHTML = 'Não consegui ler:<br>' + r.erro.slice(0,4).join('<br>');
      return;
    }
    el.value='';
    renderCompras();
    const m2 = document.getElementById('impMsg');
    if (m2){ m2.className='msg ok';
      m2.textContent = `${r.itens} ${r.itens===1?'item':'itens'} de ${r.mercado} em ${fdia(r.data)}`
        + (r.nota ? ', mais o valor gasto.' : '. Sem linha DIETA, o histórico de gasto não mudou.'); }
    return;
  }

  if (e.target.closest('#addCompra')){ openSheet('Registrar compra', formCompra()); return; }

  if (e.target.closest('#salvarNota')){
    const d=document.getElementById('nData').value;
    const m=document.getElementById('nMerc').value.trim();
    const t=numBR(document.getElementById('nTot').value);
    const msg=document.getElementById('msgNota');
    if(!d||!m||!isFinite(t)||t<=0){ msg.className='msg err'; msg.textContent='Preencha data, mercado e valor.'; return; }
    const a=notasf(); a.push({data:d,mercado:m,valor:+t.toFixed(2)});
    DB.set('notasf',a);
    document.getElementById('nTot').value='';
    renderCompras();
    const m2=document.getElementById('msgNota');
    if(m2){ m2.className='msg ok'; m2.textContent=`${BRL(t)} no ${m} registrado.`; }
    return;
  }

  if (e.target.closest('#resetPrecos')){
    DB.set('precos', PRECOS_SEED.map(o=>({p:o[0],c:o[1],u:o[2],v:o[3],m:o[4],d:o[5]})));
    DB.set('notasf', NOTAS_SEED);
    renderCompras();
    const m2=document.getElementById('msgReset') || document.getElementById('msgNota');
    if(m2){ m2.className='msg ok'; m2.textContent='Base restaurada para as 5 notas originais.'; }
    return;
  }

  const meal = e.target.closest('[data-meal]');
  if (meal){ openMeal(meal.dataset.meal); return; }

  if (e.target.closest('#sheetBack')){ history.back(); return; }

  if (e.target.closest('#clearShop')){
    DB.set('shop',{}); renderCompras(); return;
  }
});

document.addEventListener('change', (e)=>{
  const cb = e.target.closest('[data-shop]');
  if (!cb) return;
  const st = DB.get('shop',{});
  if (cb.checked) st[cb.dataset.shop]=1; else delete st[cb.dataset.shop];
  DB.set('shop', st);
  if (compraAba === 'lista') renderCompras(); else atualizaBadge();
});

document.addEventListener('change', (e)=>{
  const inp = e.target.closest('#startInput');
  if (!inp || !inp.value) return;
  DB.set('start', inp.value);
  renderMedidas(); renderAgora();
});

document.querySelectorAll('#dayToggle button').forEach(b=>
  b.addEventListener('click', ()=>setDay(b.dataset.day)));

document.addEventListener('input', (e)=>{
  if (e.target && e.target.id === 'pSearch'){
    precoFiltro = e.target.value;
    document.getElementById('pRes').innerHTML = resultadosBusca();
    document.getElementById('shopList').hidden = !!precoFiltro.trim();
  }
});

window.addEventListener('popstate', ()=>{ if (sheet.classList.contains('open')) closeSheet(); });

/* re-render ao voltar para o app e a cada minuto */
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ renderTop(); renderAgora(); renderRefeicoes(); } });
setInterval(()=>{ renderTop(); if (view==='agora') renderAgora(); }, 60000);

/* ============ boot ============ */
setDay(dayType);
renderCompras();
renderMedidas();


go('agora');

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
